core:
  - changed-files:
      - any-glob-to-any-file:
          - "scoringrules/_*.py"
          - "scoringrules/core/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
